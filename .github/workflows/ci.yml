name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genelm-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genelm-frontend/package-lock.json
      - name: Use the repository npm version
        run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run cf-typegen
        env:
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      - run: npm run check
      - run: npm run build
      - run: npm run build:cloudflare

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genelm-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            genelm-backend/requirements.txt
            genelm-backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m py_compile main.py variant_core.py
